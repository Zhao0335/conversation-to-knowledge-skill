name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scripts
        run: python -m compileall -q skills/distill-conversation/scripts
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate example bundle
        run: python skills/distill-conversation/scripts/validate_bundle.py examples/expected-debugging-bundle
